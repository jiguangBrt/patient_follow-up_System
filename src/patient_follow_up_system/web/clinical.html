<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>病例识别与审核</title><link rel="stylesheet" href="/static/app.css?v=20261020"><link rel="stylesheet" href="/static/doctor-shell.css?v=20261020-2"><link rel="stylesheet" href="/static/clinical.css?v=20261020-2"></head>
<body class="doctor-app signed-in">
<aside id="doctorSidebar" class="doctor-sidebar"></aside>
<main class="doctor-main clinical-main">
  <div class="workspace-topbar"><div><p class="breadcrumb">诊疗管理 / 病例识别与审核</p><h1>病例识别与审核</h1></div><span class="trial-tag">原件留存 · 医生确认后入档</span></div>
  <p id="message" class="status" role="status" aria-live="polite">正在加载…</p>
  <section class="card"><h2>上传病例原件</h2><p>上传后先存入缓冲区。识别姓名仅作候选；确认入档前不绑定患者或患者账号。支持 JPG、PNG、PDF（8 MB 以内，PDF 最多 10 页）。</p>
    <form id="uploadForm" class="row"><input id="file" type="file" accept="image/jpeg,image/png,application/pdf" aria-label="病例原件" required><button id="uploadButton">上传到缓冲区</button></form>
  </section>
  <section class="card"><div class="toolbar"><h2>病例缓冲区与审核记录</h2><button id="refresh" class="secondary">刷新缓冲区</button></div><div id="documents"></div></section>
  <section id="reviewCard" class="card hidden">
    <h2 id="reviewTitle">逐字段审核</h2><p id="documentMeta" class="muted"></p><p id="extractionState" class="status"></p>
    <div class="row"><button id="extract">运行本机 OCR</button><button id="openOriginal" class="secondary">打开原件</button><button id="history" class="secondary">查看审核记录</button></div>
    <p>OCR 置信度只表示文字识别结果。请对照证据确认；未知保持待确认，明确记载“无”时才确认“无”。药名、剂量、疑似诊断均须逐项核对。</p>
    <div class="clinical-grid">
      <div class="evidence-panel"><label for="previewPage">原件页码</label><select id="previewPage"></select><p id="evidenceText" class="muted">点击字段的“定位原文”查看对应证据。</p><div id="previewWrap"><img id="preview" alt="病例阅读预览"><div id="highlight" class="hidden"></div></div></div>
      <div id="fields"></div>
    </div>
    <div class="review-actions"><label for="targetPatient">确认入档患者</label><select id="targetPatient"><option value="">请人工选择，不按识别姓名自动匹配</option></select>
      <p class="muted">先确认正确姓名和至少一项病历内容。新建只创建患者档案，患者账号仍通过专属邀请认领。已有资料须归入原患者。</p>
      <div class="row"><button id="save" class="secondary">保存逐字段审核，暂不入档</button><button id="fileRecord">确认身份并入档</button><button id="reject" class="secondary">整份驳回</button></div>
    </div>
    <pre id="historyText" class="hidden"></pre>
  </section>
</main><script src="/static/doctor-shell.js?v=20261020-2"></script><script src="/static/clinical.js?v=20261020-2"></script></body></html>
