<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>患者随访邀请</title>
  <link rel="stylesheet" href="/static/app.css?v=20260911-5">
</head>
<body class="patient-page">
  <header class="patient-header">
    <h1>患者随访</h1>
    <p>请在医护人员协助下完成首次绑定</p>
  </header>
  <main class="mobile">
    <section class="card patient-card">
      <p class="step-label">当前步骤</p>
      <h2 id="title">正在检查邀请</h2>
      <div id="status" class="status" role="status" aria-live="polite">请稍候…</div>

      <form id="bindForm" class="hidden patient-form">
        <p class="plain-help">首次使用可以直接创建患者账号；已有账号也可以登录后认领档案。</p>
        <div class="mode-switch" role="group" aria-label="账号方式">
          <button id="registerMode" type="button">我还没有账号</button>
          <button id="loginMode" type="button" class="secondary">我已有账号</button>
        </div>
        <div id="registerFields">
          <div class="notice-box">登录账号由系统自动分配为 8 位数字，开户成功后会显示。</div>
          <label for="newPassword">设置登录密码</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 位">
          <label for="confirmPassword">再次输入密码</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="再次输入相同密码">
        </div>
        <div id="loginFields" class="hidden">
          <label for="username">患者账号</label>
          <input id="username" autocomplete="username">
          <label for="password">登录密码</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <label for="code">6 位核验码</label>
        <input id="code" class="code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-describedby="codeHelp">
        <p id="codeHelp" class="muted">核验码只用于本次试用核验；多次输错会锁定邀请。</p>
        <button id="submitButton" type="submit">创建账号并认领档案</button>
      </form>

      <div id="done" class="hidden completion">
        <div class="completion-mark" aria-hidden="true">✓</div>
        <h3>首次绑定已完成</h3>
        <p>系统分配的患者账号</p>
        <div id="createdUsername" class="secret"></div>
        <p><strong>请记下这个 8 位数字账号。</strong>账号和患者档案已经关联，今后可以直接进入患者中心。</p>
        <a class="buttonLink" href="/patient">进入患者中心</a>
      </div>

      <aside class="care-note">
        <strong>请注意</strong>
        <p>这是医生客户试用版，当前核验不等同于医院正式身份认证，也不提供诊断、处方或急救服务。</p>
        <p>如有严重不适，请及时前往正规医疗机构。</p>
      </aside>
    </section>
  </main>
  <script src="/static/invite.js?v=20260911-3"></script>
</body>
</html>
