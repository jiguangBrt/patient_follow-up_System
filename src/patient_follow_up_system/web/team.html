<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生与权限 · 随访工作台</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/doctor-shell.css?v=20261027-team-1"><link rel="stylesheet" href="/static/admin.css?v=20261027-team-1"><link rel="stylesheet" href="/static/team.css?v=20261027-team-4"><link rel="stylesheet" href="/static/theme.css?v=20261028-theme-3"><script src="/static/accessibility.js?v=20261028-theme-3"></script></head>
<body class="doctor-app signed-in">
<aside id="doctorSidebar" class="doctor-sidebar"></aside>
<main class="doctor-main">
  <div class="workspace-topbar"><div><p class="breadcrumb">设置 / 学生与权限</p><h1>学生与权限</h1></div></div>
  <p id="message" class="status hidden" role="status" aria-live="polite"></p>
  <section id="teamContent" class="card hidden" aria-label="学生列表">
    <div class="toolbar team-toolbar"><div><span id="studentCount" class="muted"></span></div><div class="row"><button id="refreshTeam" type="button" class="secondary">刷新</button><button id="newStudent" type="button" aria-haspopup="dialog" aria-controls="studentDialog">＋ 新增学生</button></div></div>
    <div class="account-table-wrap"><table class="account-table"><thead><tr><th scope="col">姓名</th><th scope="col">账号</th><th scope="col">状态</th><th scope="col">学生权限</th><th scope="col">上次登录（北京时间）</th><th scope="col">操作</th></tr></thead><tbody id="students"></tbody></table></div>
  </section>
</main>
<dialog id="studentDialog" class="team-dialog" aria-labelledby="studentDialogTitle">
  <header class="team-dialog-header"><div><h2 id="studentDialogTitle">新增学生</h2></div><button type="button" data-close="studentDialog" class="dialog-close" aria-label="关闭新增学生">×</button></header>
  <p id="studentError" class="status error hidden dialog-error" role="alert"></p>
  <form id="studentForm" class="team-dialog-form">
    <div class="team-dialog-body form-grid">
      <label for="studentUsername">登录账号</label><input id="studentUsername" pattern="[A-Za-z0-9_][A-Za-z0-9_.-]{2,49}" maxlength="50" autocomplete="off" required placeholder="3–50 位字母、数字或 _ . -">
      <label for="studentName">学生姓名</label><input id="studentName" maxlength="100" required placeholder="请输入学生姓名">
      <label for="studentPassword">初始密码</label><div class="password-row"><input id="studentPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="至少 8 位"><button id="showPassword" type="button" class="secondary" aria-pressed="false">显示密码</button></div>
      <label for="studentConfirm">确认密码</label><div class="password-row"><input id="studentConfirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="再次输入初始密码"><button id="showConfirm" type="button" class="secondary" aria-pressed="false">显示密码</button></div>
    </div>
    <footer class="team-dialog-footer"><button type="button" class="secondary" data-close="studentDialog">取消</button><button id="createStudentButton" type="submit">开通账号</button></footer>
  </form>
</dialog>
<dialog id="grantDialog" class="team-dialog" aria-labelledby="grantDialogTitle">
  <header class="team-dialog-header"><div><h2 id="grantDialogTitle">设置学生权限</h2></div><button type="button" data-close="grantDialog" class="dialog-close" aria-label="关闭分配权限">×</button></header>
  <p id="grantError" class="status error hidden dialog-error" role="alert"></p>
  <form id="grantForm" class="team-dialog-form">
    <input id="grantStudent" type="hidden">
    <div class="team-dialog-body form-grid">
      <span class="field-label">有效期</span><div class="grant-period-row"><fieldset id="grantPeriod" class="grant-period-fields" aria-label="授权日期范围"><input id="grantStart" type="date" aria-label="开始日期" required><span>至</span><input id="grantEnd" type="date" aria-label="截止日期" required></fieldset><label class="permanent-option"><input id="grantPermanent" type="checkbox">永久有效</label></div>
      <span class="field-label">操作权限</span><div class="grant-checkboxes"><label><input id="grantView" type="checkbox" checked>查看</label><label><input id="grantEdit" type="checkbox">录入、OCR 与暂存</label><label><input id="grantReview" type="checkbox">审核、确认入档与驳回</label></div>
      <label for="grantNote">备注</label><textarea id="grantNote" class="grant-note" maxlength="300" rows="2" placeholder="选填"></textarea>
    </div>
    <footer class="team-dialog-footer"><button type="button" class="secondary" data-close="grantDialog">取消</button><button id="createGrantButton" type="submit">保存权限</button></footer>
  </form>
</dialog>
<script src="/static/session.js?v=20261027-team-2"></script><script src="/static/doctor-shell.js?v=20261027-team-1"></script><script src="/static/team.js?v=20261027-team-4"></script>
</body></html>
