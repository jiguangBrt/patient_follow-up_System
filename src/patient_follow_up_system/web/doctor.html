<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医生工作台</title>
  <link rel="stylesheet" href="/static/app.css?v=20260911-5">
  <link rel="stylesheet" href="/static/doctor-shell.css?v=20261022-intake-2">
  <link rel="stylesheet" href="/static/patient-workspace.css?v=20261024-workspace-1">
  <link rel="stylesheet" href="/static/theme.css?v=20261028-theme-3">
  <script src="/static/accessibility.js?v=20261028-theme-3"></script>
</head>
<body class="doctor-app signed-in">
  <aside id="doctorSidebar" class="doctor-sidebar"></aside>
  <main class="doctor-main">
    <div class="workspace-topbar"><div><p id="breadcrumb" class="breadcrumb">诊疗管理 / 患者管理</p><h1 id="pageTitle">患者管理</h1></div><span class="trial-tag">试用环境 · 仅虚构或去标识化资料</span></div>
    <section id="patientsCard" class="hidden" aria-label="患者管理工作区">
      <aside class="patient-directory" aria-label="患者名单">
        <div class="directory-header"><h2>患者管理</h2><p id="patientCounts" class="muted"></p><button id="showNewPatient">＋ 新增患者</button><input id="patientSearch" type="search" placeholder="搜索姓名或编号" aria-label="搜索患者姓名或编号"></div>
        <div id="patients" class="patient-name-list" role="group" aria-label="选择患者"></div>
      </aside>
      <section class="patient-detail-pane" aria-label="患者档案">
        <header class="patient-detail-header"><div><p class="workspace-eyebrow">患者档案</p><h1 id="patientHeading">请选择患者</h1><p id="patientMeta" class="muted"></p></div><div class="row"><button id="showPatientQr" class="secondary" disabled>建档二维码 / 重印</button><button id="refreshPatient" class="secondary" disabled>刷新档案</button></div></header>
        <div id="patientDetailScroll" tabindex="0" aria-label="就诊档案列表"><div class="patient-empty"><h2>从左侧选择患者</h2><p>每次就诊的病历与报告将在这里按日期展示。</p></div></div>
      </section>
    </section>
    <section class="card hidden" id="noticeCard"><h2>当前患者须知</h2><p id="doctorNoticeSummary" class="muted"></p><div id="doctorNoticeContent" class="notice-fulltext"></div></section>
    <section class="card hidden" id="intakesCard"><div class="toolbar"><div><h2>建档申请</h2><p class="muted">核对患者填写的基本信息与提交资料</p></div><div class="row"><button id="refreshIntakes" class="secondary">刷新申请</button><button id="createIntakeLink">录入姓名并生成专属码</button></div></div><div id="intakes"></div></section>
    <section class="card hidden" id="placeholderCard"><div class="placeholder-content"><div><span class="placeholder-icon" aria-hidden="true">◷</span><h2 id="placeholderTitle"></h2><p id="placeholderDescription"></p><p>待建设</p></div></div></section>
    <div id="message" class="status hidden" role="status" aria-live="polite"></div>
  </main>
  <dialog id="newPatientCard" class="doctor-modal hidden" aria-labelledby="newPatientTitle"><h2 id="newPatientTitle">新增患者</h2><form id="newPatientForm" class="form-grid"><label for="patientName">患者姓名</label><input id="patientName" required maxlength="100" placeholder="请输入医生确认的姓名"><p class="muted full-row">保存后从档案顶部打开专属建档二维码。</p><p id="newPatientError" class="status error hidden full-row" role="alert"></p><div class="row full-row"><button type="submit">保存患者</button><button type="button" class="secondary" id="cancelNewPatient">取消</button></div></form></dialog>
  <dialog id="inviteCard" class="doctor-modal hidden" aria-labelledby="qrTitle"><h2 id="qrTitle">患者专属建档二维码</h2><h3 id="qrPatientName"></h3><p>请妥善保管，可反复扫码阅读须知、填写信息和补交病历。</p><div id="qr" class="qr"></div><p id="expiry" class="muted"></p><p id="qrUrl" class="qr-url"></p><p class="muted">医生停用后，已打印的二维码也随即失效。</p><div class="row no-print"><a id="openInvite" class="buttonLink" target="_blank" rel="noreferrer">打开患者扫码页</a><button id="printInvite">打印二维码</button><button id="revokeInvite" class="secondary">停用二维码</button><button id="closeInvite" class="secondary">关闭</button></div></dialog>
  <script src="/static/session.js?v=20261027-team-2"></script><script src="/static/doctor-shell.js?v=20261027-team-1"></script><script src="/static/doctor.js?v=20261027-team-3"></script>
</body></html>
