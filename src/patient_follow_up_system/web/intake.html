<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>患者随访</title><link rel="stylesheet" href="/static/app.css?v=20261022-intake-2"><link rel="stylesheet" href="/static/theme.css?v=20261028-theme-4"><link rel="stylesheet" href="/static/gastritis.css?v=20261029-gastritis-2"><link rel="stylesheet" href="/static/portal.css?v=20261029-portal-2"><script src="/static/accessibility.js?v=20261028-theme-4"></script></head>
<body class="patient-page portal-page"><header class="patient-header portal-header"><div><h1 id="pageTitle">我的</h1></div></header><main class="portal-main"><div id="status" class="status" role="status" aria-live="polite">正在连接医生…</div>
<section id="homeView" class="portal-view hidden" aria-label="首页"><div class="portal-welcome"><h2 id="welcomeName">您好</h2></div><div class="portal-shortcuts"><button type="button" data-go="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg><strong>健康档案</strong><small>病情 · 病史 · 幽门螺杆菌</small></button><button type="button" data-go="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8m-8 4h5"/></svg><strong>诊疗记录</strong><small>门诊病历 · 检查报告</small></button></div></section>
<section id="meView" class="portal-view hidden" aria-label="我的"><section class="portal-card"><h2>基本信息</h2><p id="profileHelp"></p><form id="profileForm" class="portal-form"><label>姓名<input id="displayName" required maxlength="100" autocomplete="name"></label><div class="portal-grid"><label>性别<select id="sex"><option>未说明</option><option>男</option><option>女</option></select></label><label>出生日期<input id="dateOfBirth" type="date" required></label></div><label>手机号（选填）<input id="phone" type="tel" maxlength="30" autocomplete="tel"></label><label>填写人<select id="relationship"><option>本人</option><option>家属协助</option></select></label><label id="registerConsentRow" class="portal-consent"><input id="registerConsent" type="checkbox" required><span>我已阅读并同意 <button type="button" class="portal-text" data-notice>《患者须知》</button></span></label><button id="saveProfile" type="submit">保存并进入首页</button></form></section><section id="deviceSection" class="portal-card hidden"><h2>本机访问</h2><p>请勿与他人共用浏览器。换手机后，请联系医生恢复档案。</p><button id="logoutPortal" class="secondary" type="button">退出本机访问</button></section></section>
<section id="healthView" class="portal-view hidden" aria-label="健康档案"><button type="button" class="portal-back" data-go="home">‹ 返回首页</button><section class="portal-card"><h2>健康档案</h2><form id="healthForm"><label>本次记录日期<input id="healthDate" type="date" required></label><div id="healthFields"></div><button id="saveHealth" type="submit">保存本次健康档案</button></form></section><section class="portal-card"><h2>历次记录</h2><div id="healthHistory"></div></section></section>
<section id="recordsView" class="portal-view hidden" aria-label="诊疗记录"><button type="button" class="portal-back" data-go="home">‹ 返回首页</button><div class="portal-section-heading"><h2>诊疗记录</h2><button type="button" data-go="upload">＋ 添加记录</button></div><div id="documentList"></div></section>
<section id="uploadView" class="portal-view hidden" aria-label="添加诊疗记录"><button type="button" class="portal-back" data-go="records">‹ 返回诊疗记录</button><section class="portal-card"><h2>添加诊疗记录</h2><form id="uploadForm" class="portal-form"><label>资料类型<select id="recordType"><option>门诊病历</option><option>检查报告</option><option>检验报告</option><option>住院记录</option><option>其他资料</option></select></label><label>就诊 / 检查日期<input id="eventDate" type="date" required></label><label class="portal-upload">＋ 选择照片或文件<input id="document" type="file" accept="image/jpeg,image/png,application/pdf" required></label><p id="fileName">支持 JPG、PNG、PDF，每份不超过 8 MB。</p><img id="preview" class="document-preview hidden" alt="待上传资料预览"><label>补充说明（选填）<textarea id="patientNote" rows="3" maxlength="500"></textarea></label><label class="portal-consent"><input id="uploadConsent" type="checkbox" required><span>我已阅读并同意 <button type="button" class="portal-text" data-notice>《患者须知》</button></span></label><button id="uploadButton" type="submit">上传诊疗资料</button></form></section></section>
</main><nav class="portal-bottom" aria-label="患者导航"><button type="button" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg><span>首页</span></button><button type="button" data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>我的</span></button></nav><dialog id="noticeDialog" class="portal-dialog"><div class="portal-section-heading"><h2 id="noticeTitle">患者须知</h2><button type="button" id="closeNotice">关闭</button></div><p id="noticeVersion"></p><div id="noticeContent"></div></dialog><dialog id="recordDialog" class="portal-dialog"><div class="portal-section-heading"><h2>既往健康档案</h2><button type="button" id="closeRecord">关闭</button></div><div id="recordDetail"></div></dialog><script src="/static/gastritis.js?v=20261029-gastritis-2"></script><script src="/static/intake.js?v=20261029-portal-2"></script></body></html>
