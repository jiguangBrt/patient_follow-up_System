# Temporary HTTP configuration while the first certificate is being issued.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/project-locations/*.conf;
    location / { return 404; }
}
